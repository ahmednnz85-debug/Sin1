<!doctype html>
<html lang="en">
<meta charset="utf-8">
<base href="../">
<title>T1 Sacred Entrance inspection</title>
<style>body{margin:0;background:#20160e;color:#eadbc5;font:14px system-ui}#result{position:fixed;inset:10px auto auto 10px;background:#20160e;padding:.6rem}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}
</script>
<script src="vendor/clipper.js"></script>
<script src="wing-architecture.js"></script>
<script src="great-library.js"></script>
<script src="t1-entrance.js"></script>
<output id="result">Loading T1</output>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
window.THREE = THREE;
const result = document.getElementById('result');
try {
  const response = await fetch('data/palace-colliders.json');
  if (!response.ok) throw new Error('The palace layout could not be loaded');
  const { hall } = await response.json();
  const { rooms, doors } = PalaceWingArchitecture.solveLayout(hall);
  const loader = new GLTFLoader();
  const entrance = await SinT1Entrance.build(rooms.find(r => r.id === 'T1'),
    doors.filter(d => d.from === 'T1' || d.to === 'T1'),
    url => loader.loadAsync(encodeURI(url)), new AbortController().signal, false);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x382519);
  scene.add(entrance.root,new THREE.HemisphereLight(0xffecd4,0x573924,2.3));
  const camera = entrance.camera;
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  document.body.append(renderer.domElement);
  renderer.setAnimationLoop(time => {
    entrance.update(time*.001);
    renderer.render(scene,camera);
  });
  addEventListener('pagehide', () => {
    renderer.setAnimationLoop(null);
    entrance.dispose();
    renderer.dispose();
  }, {once:true});
  result.value = 'T1 model and three atlases loaded';
} catch (error) {
  result.value = error.message;
}
</script>
</html>
