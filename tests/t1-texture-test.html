<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <base href="../">
  <title>T1 Texture Atlas Test</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151d;color:#f3e4c6;font:14px/1.5 system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%}
    #panel{position:fixed;z-index:2;top:10px;right:10px;width:min(390px,calc(100vw - 40px));max-height:44vh;overflow:auto;padding:12px 14px;background:rgba(8,12,18,.9);border:1px solid #987b47;box-shadow:0 8px 28px #0009;white-space:pre-wrap}
    #panel strong{color:#e7c477}#status{display:block;margin-top:6px;color:#c8dded}#details{font:11px/1.45 ui-monospace,monospace;color:#d5cfbd;direction:ltr;text-align:left}
    button{margin-top:8px;padding:6px 10px;background:#263549;color:#f2e4c8;border:1px solid #987b47}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="panel"><strong>اختبار خامات غرفة T1</strong><span id="status">تهيئة المشهد…</span><button id="view">إعادة توجيه الكاميرا إلى البوابة</button><div id="details"></div></div>
  <script type="text/plain" data-legacy-script data-src="../t1-entrance.js?v=t1-atlas"></script>
  <script type="text/plain" data-legacy-script>
    (function(){
      const status=document.getElementById('status'),details=document.getElementById('details');
      const scene=new THREE.Scene();scene.background=new THREE.Color(0x10151d);
      const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,100);
      camera.position.set(0,3.2,1.5);camera.lookAt(8,3,0);
      const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});
      renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
      renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.95;
      document.body.appendChild(renderer.domElement);
      scene.add(new THREE.HemisphereLight(0xc8ddf0,0x292019,0.7));
      const cool=new THREE.DirectionalLight(0x8dbce0,0.7);cool.position.set(-7,10,4);scene.add(cool);
      const warm=new THREE.PointLight(0xffa34d,12,20,2);warm.position.set(5,2.8,0);scene.add(warm);
      const room={id:'T1',height:8.5,bbox:{x0:-8,x1:8,z0:-6,z1:6,cx:0,cz:0}};
      const ctx={doors:[{from:'T1',to:'TEST',axis:'x',x:8,z:0,width:3.4,height:6.5}],colliders:[],fires:[]};
      const root=SinT1Entrance.build(room,scene,ctx);
      function report(){
        const states=SinT1Entrance.getTextureLoadStatus(),keys=SinT1Entrance.textureKeys();
        const loaded=keys.filter(k=>states[k]==='loaded'||states[k]==='loaded-cached').length;
        const errors=keys.filter(k=>states[k]==='error'||states[k]==='material-missing');
        const maps=Object.fromEntries(keys.map(k=>{const m=SinT1Entrance.materials[k==='columnBase'?'base':k];return[k,{loaded:!!(m&&m.map&&m.map.image&&m.map.image.width),file:m&&m.map&&m.map.userData&&m.map.userData.t1AtlasMap||null,size:m&&m.map&&m.map.image?[m.map.image.width,m.map.image.height]:null}]}));
        const seenFiles=new Set();let pixels=0;Object.values(maps).forEach(x=>{if(x.size&&!seenFiles.has(x.file)){seenFiles.add(x.file);pixels+=x.size[0]*x.size[1]}});
        const gpuMB=(pixels*4*4/3/1048576).toFixed(2);
        status.textContent='خانات المواد: '+loaded+'/'+keys.length+' · '+seenFiles.size+' صورة فريدة · '+(loaded===keys.length?'نجاح':'قيد التحميل')+' · RGBA مع mipmaps: '+gpuMB+' MiB';
        details.textContent=JSON.stringify({groups:root.children.length,textureStatus:states,errors,maps},null,2);
        window.__t1TextureTest={ready:loaded===keys.length&&errors.length===0,loaded,total:keys.length,uniqueImages:seenFiles.size,errors,maps,gpuEstimateMiB:Number(gpuMB),geometryGroups:root.children.length};
      }
      document.getElementById('view').onclick=()=>{camera.position.set(0,3.2,1.5);camera.lookAt(8,3,0);};
      addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
      let lastReport=0;
      function frame(now){renderer.render(scene,camera);if(now-lastReport>500){report();lastReport=now}requestAnimationFrame(frame)}
      window.__t1TestScene={scene,camera,renderer,root,room};
      requestAnimationFrame(frame);
    })();
  </script>
  <script type="module" src="../three-compat.js?v=t1-atlas"></script>
</body>
</html>
